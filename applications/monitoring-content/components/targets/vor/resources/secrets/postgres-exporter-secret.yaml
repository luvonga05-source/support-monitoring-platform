# IMPORTANT: This is a template. Do NOT commit plaintext credentials.
# To generate the real SealedSecret, run:
#
#   kubectl create secret generic pgx-conn \
#     --namespace=target-vor \
#     --from-literal=username=pgwatch2 \
#     --from-literal=password='<actual-password>' \
#     --dry-run=client -o yaml \
#   | kubeseal --controller-namespace=sealed-secrets \
#              --controller-name=sealed-secrets \
#              --format=yaml > postgres-exporter-secret.yaml
#
# Then replace this file with the output above.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pgx-conn
  namespace: target-vor
spec:
  encryptedData:
    username: <sealed-username-here>
    password: <sealed-password-here>
  template:
    metadata:
      name: pgx-conn
      namespace: target-vor
    type: Opaque
